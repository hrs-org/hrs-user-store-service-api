name: Release UAT to AKS

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Version to deploy (e.g., 1.0.0, dev-abc123, or "latest")'
                required: true
                default: "latest"
                type: string
            environment:
                description: "Target environment"
                required: true
                default: "uat"
                type: choice
                options:
                    - uat
                    - staging

env:
    AZURE_RESOURCE_GROUP: rg-hrsm-uat
    AKS_CLUSTER_NAME: hrsm-uat-aks
    NAMESPACE: uat
    DEPLOYMENT_NAME: hrs-user-service
    SERVICE_NAME: hrs-user-service

jobs:
    deploy-to-aks:
        name: Deploy to AKS ${{ github.event.inputs.environment }}
        runs-on: ubuntu-latest
        environment: ${{ github.event.inputs.environment }}
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Azure CLI
              uses: azure/login@cb79c773a3cfa27f31f25eb3f677781210c9ce3d
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Set up kubectl
              uses: azure/setup-kubectl@901a10e89ea615cf61f57ac05cecdf23e7de06d8
              with:
                  version: "latest"

            - name: Get AKS credentials
              run: |
                  az aks get-credentials \
                    --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                    --name ${{ env.AKS_CLUSTER_NAME }} \
                    --overwrite-existing

            - name: Create namespace if not exists
              run: |
                  kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

            - name: Label namespace for Istio sidecar injection
              run: |
                  kubectl label namespace ${{ env.NAMESPACE }} istio-injection=enabled --overwrite

            - name: Attach ACR to AKS (if not already attached)
              env:
                  ACR_NAME: ${{ secrets.ACR_NAME }}
              run: |
                  az aks update \
                    --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                    --name ${{ env.AKS_CLUSTER_NAME }} \
                    --attach-acr "$ACR_NAME" || echo "ACR already attached or unable to attach"

            - name: Verify image exists in ACR
              env:
                  ACR_NAME: ${{ secrets.ACR_NAME }}
                  IMAGE_TAG: ${{ github.event.inputs.version }}
              run: |
                  echo "🔍 Verifying image exists in ACR..."

                  # List all available tags
                  echo "Available tags:"
                  az acr repository show-tags \
                    --name "$ACR_NAME" \
                    --repository hrs-user-service \
                    --orderby time_desc \
                    --output table

                  # Check if specific tag exists
                  if az acr repository show-tags \
                      --name "$ACR_NAME" \
                      --repository hrs-user-service \
                      --output tsv | grep -Fxq "$IMAGE_TAG"; then
                    echo "✅ Image tag '${IMAGE_TAG}' found in ACR"
                  else
                    echo "❌ Image tag '${IMAGE_TAG}' not found in ACR"
                    echo ""
                    echo "Please use one of the available tags listed above or build the image first."
                    exit 1
                  fi

            - name: Validate deployment secrets
              env:
                  DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
                  MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
                  MYSQL_USER_PASSWORD: ${{ secrets.MYSQL_USER_PASSWORD }}
                  JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
              run: |
                  missing=0

                  for name in DB_CONNECTION_STRING MYSQL_ROOT_PASSWORD MYSQL_USER_PASSWORD JWT_SECRET_KEY; do
                    if [ -z "${!name}" ]; then
                      echo "❌ Missing required GitHub secret: $name"
                      missing=1
                    fi
                  done

                  if [ "$missing" -ne 0 ]; then
                    exit 1
                  fi

            - name: Prepare deployment manifests
              env:
                  IMAGE_TAG: ${{ github.event.inputs.version }}
                  MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
                  MYSQL_USER_PASSWORD: ${{ secrets.MYSQL_USER_PASSWORD }}
                  MYSQL_DATABASE: "${{ secrets.MYSQL_DATABASE || 'hrsdb' }}"
                  MYSQL_USERNAME: "${{ secrets.MYSQL_USERNAME || 'hrsuser' }}"
                  DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
                  ACR_NAME: ${{ secrets.ACR_NAME }}
                  JWT_ISSUER: "${{ secrets.JWT_ISSUER || 'https://auth.hrs.com' }}"
                  JWT_AUDIENCE: "${{ secrets.JWT_AUDIENCE || 'https://hrs-api' }}"
                  JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
                  ALLOWED_ORIGINS: "${{ secrets.ALLOWED_ORIGINS || 'http://localhost:4200' }}"
                  EMAIL_SERVICE_ENDPOINT: "${{ secrets.EMAIL_SERVICE_ENDPOINT || 'http://localhost:5001' }}"
              run: |
                  echo "Preparing deployment manifests with GitHub secrets..."

                  sed "s|__MYSQL_ROOT_PASSWORD__|$MYSQL_ROOT_PASSWORD|g" k8s/mysql-statefulset.yaml | \
                  sed "s|__MYSQL_USER_PASSWORD__|$MYSQL_USER_PASSWORD|g" | \
                  sed "s|__MYSQL_DATABASE__|$MYSQL_DATABASE|g" | \
                  sed "s|__MYSQL_USERNAME__|$MYSQL_USERNAME|g" \
                  > k8s/mysql-statefulset-final.yaml

                  # Replace placeholders in the deployment file
                  sed "s|__ACR_NAME__|$ACR_NAME|g" k8s/deployment-uat.yaml | \
                  sed "s|__IMAGE_TAG__|$IMAGE_TAG|g" | \
                  sed "s|__DB_CONNECTION_STRING__|$DB_CONNECTION_STRING|g" | \
                  sed "s|__JWT_ISSUER__|$JWT_ISSUER|g" | \
                  sed "s|__JWT_AUDIENCE__|$JWT_AUDIENCE|g" | \
                  sed "s|__JWT_SECRET_KEY__|$JWT_SECRET_KEY|g" | \
                  sed "s|__ALLOWED_ORIGINS__|$ALLOWED_ORIGINS|g" | \
                  sed "s|__EMAIL_SERVICE_ENDPOINT__|$EMAIL_SERVICE_ENDPOINT|g" \
                  > k8s/deployment-final.yaml

                  # Show the final manifest for debugging (mask sensitive values)
                  echo "=== Final Deployment Manifest (sensitive values masked) ==="
                  cat k8s/deployment-final.yaml | grep -v "DB_CONNECTION_STRING" | grep -v "JWT_SECRET_KEY" || cat k8s/deployment-final.yaml

                  echo "=== Final MySQL Manifest (sensitive values masked) ==="
                  cat k8s/mysql-statefulset-final.yaml | grep -v "root-password" | grep -v "user-password" || cat k8s/mysql-statefulset-final.yaml

            - name: Ensure MySQL exists
              run: |
                  echo "Checking MySQL resources..."

                  if kubectl get secret/mysql-user-secret service/mysql-user-db statefulset.apps/mysql-user-db -n ${{ env.NAMESPACE }} >/dev/null 2>&1; then
                    echo "MySQL resources already exist. Skipping MySQL apply."
                  else
                    echo "MySQL resources are missing. Creating MySQL resources..."
                    kubectl apply -f k8s/mysql-statefulset-final.yaml
                  fi

            - name: Deploy to AKS
              run: |
                  echo "🚀 Deploying to AKS..."
                  kubectl apply -f k8s/deployment-final.yaml

                  # Wait for deployment to be fully registered
                  echo "Waiting for deployment to be registered..."
                  for i in {1..10}; do
                    if kubectl get deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }} &>/dev/null; then
                      echo "✅ Deployment registered"
                      break
                    fi
                    echo "Waiting... ($i/10)"
                    sleep 2
                  done

                  # Annotate deployment with metadata
                  if kubectl get deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }} &>/dev/null; then
                    kubectl annotate deployment/${{ env.DEPLOYMENT_NAME }} \
                      -n ${{ env.NAMESPACE }} \
                      deployment.kubernetes.io/version="${{ github.event.inputs.version }}" \
                      deployment.kubernetes.io/deployed-by="${{ github.actor }}" \
                      deployment.kubernetes.io/deployed-at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
                      --overwrite
                    echo "✅ Deployment annotated"
                  else
                    echo "⚠️ Could not find deployment to annotate (deployment may still be initializing)"
                  fi

            - name: Wait for deployment rollout
              run: |
                  echo "⏳ Waiting for deployment to complete..."
                  kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} \
                    --namespace=${{ env.NAMESPACE }} \
                    --timeout=300s

            - name: Force restart deployment
              run: |
                  echo "🔄 Forcing deployment restart for clean startup..."
                  kubectl rollout restart deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }}

            - name: Wait for restart to complete
              run: |
                  echo "⏳ Waiting for restart to complete..."
                  kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} \
                    --namespace=${{ env.NAMESPACE }} \
                    --timeout=300s

            - name: Verify deployment
              run: |
                  echo "✅ Deployment completed. Verifying status..."
                  echo ""

                  echo "📦 Deployment status:"
                  kubectl get deployment ${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }} -o wide
                  echo ""

                  echo "🔄 Pod status:"
                  kubectl get pods -l app=hrs-user-service -n ${{ env.NAMESPACE }} -o wide
                  echo ""

                  echo "🌐 Service status:"
                  kubectl get service ${{ env.SERVICE_NAME }} -n ${{ env.NAMESPACE }}
                  echo ""

                  echo "📜 Deployment history:"
                  kubectl rollout history deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }}

            - name: Run smoke tests
              run: |
                  echo "🧪 Running smoke tests..."

                  # Get the service endpoint
                  SERVICE_IP=$(kubectl get service ${{ env.SERVICE_NAME }} -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.clusterIP}')
                  echo "Service IP: $SERVICE_IP"

                  # Port forward for testing (runs in background)
                  kubectl port-forward service/${{ env.SERVICE_NAME }} 8080:80 -n ${{ env.NAMESPACE }} &
                  PORT_FORWARD_PID=$!

                  # Wait for port forward to be ready
                  echo "Waiting for port forward to be ready..."
                  sleep 10

                  # Test health endpoint
                  echo "Testing health endpoint..."
                  if curl -f -s http://localhost:8080/health; then
                    echo ""
                    echo "✅ Health check passed"
                    HEALTH_STATUS="success"
                  else
                    echo ""
                    echo "❌ Health check failed"
                    HEALTH_STATUS="failed"
                  fi

                  # Clean up port forward
                  kill $PORT_FORWARD_PID || true

                  # Exit with error if health check failed
                  if [ "$HEALTH_STATUS" = "failed" ]; then
                    exit 1
                  fi

            - name: Post deployment summary
              if: always()
              run: |
                  echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
                  echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
                  echo "| **Service** | User Store Service |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Environment** | \`${{ github.event.inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Version** | \`${{ github.event.inputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Namespace** | \`${{ env.NAMESPACE }}\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Cluster** | \`${{ env.AKS_CLUSTER_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Deployed by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Deployed at** | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY

                  if [ "${{ job.status }}" == "success" ]; then
                    echo "### ✅ Status: Deployment Successful" >> $GITHUB_STEP_SUMMARY
                  else
                    echo "### ❌ Status: Deployment Failed" >> $GITHUB_STEP_SUMMARY
                  fi

    rollback:
        name: Rollback if needed
        runs-on: ubuntu-latest
        needs: deploy-to-aks
        if: failure()
        environment: ${{ github.event.inputs.environment }}
        permissions: {}
        steps:
            - name: Set up Azure CLI
              uses: azure/login@cb79c773a3cfa27f31f25eb3f677781210c9ce3d
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Set up kubectl
              uses: azure/setup-kubectl@901a10e89ea615cf61f57ac05cecdf23e7de06d8
              with:
                  version: "latest"

            - name: Get AKS credentials
              run: |
                  az aks get-credentials \
                    --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                    --name ${{ env.AKS_CLUSTER_NAME }} \
                    --overwrite-existing

            - name: Rollback deployment
              run: |
                  echo "Rolling back deployment..."
                  kubectl rollout undo deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }}
                  kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }} --timeout=300s

                  echo "Rollback completed. Current deployment status:"
                  kubectl get deployment ${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }}

    Integration-Tests:
        name: Integration-Tests
        runs-on: ubuntu-latest
        needs: deploy-to-aks
        environment: ${{ github.event.inputs.environment }}
        steps:
            - name: Set up Azure CLI
              uses: azure/login@cb79c773a3cfa27f31f25eb3f677781210c9ce3d
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Set up kubectl
              uses: azure/setup-kubectl@901a10e89ea615cf61f57ac05cecdf23e7de06d8
              with:
                  version: "latest"

            - name: Get AKS credentials
              run: |
                  az aks get-credentials \
                    --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                    --name ${{ env.AKS_CLUSTER_NAME }} \
                    --overwrite-existing

            - name: Wait for API and DB workloads
              run: |
                  echo "Waiting for user service deployment..."
                  kubectl wait \
                    --namespace=${{ env.NAMESPACE }} \
                    --for=condition=available deployment/${{ env.DEPLOYMENT_NAME }} \
                    --timeout=300s

                  echo "Waiting for MySQL statefulset..."
                  kubectl rollout status \
                    statefulset/mysql-user-db \
                    --namespace=${{ env.NAMESPACE }} \
                    --timeout=300s

            - name: Check API via UAT endpoint
              env:
                  BASE_URL: ${{ secrets.UAT_API_ENDPOINT }}
              run: |
                  set -euo pipefail

                  BASE_URL="${BASE_URL%/}"
                  if [ -z "$BASE_URL" ]; then
                    echo "UAT_API_ENDPOINT secret is not set"
                    exit 1
                  fi

                  BASE_URL="${BASE_URL%/}"
                  echo "Checking user service health via gateway route: $BASE_URL/health/users"
                  curl -sSf "$BASE_URL/health/users" >/dev/null
                  echo "API health check passed"

            - name: Check MySQL readiness and ping
              run: |
                  set -euo pipefail

                  echo "Checking MySQL service and endpoints..."
                  kubectl get service mysql-user-db -n ${{ env.NAMESPACE }}
                  MYSQL_ENDPOINT_IP=$(kubectl get endpoints mysql-user-db -n ${{ env.NAMESPACE }} -o jsonpath='{.subsets[0].addresses[0].ip}')
                  if [ -z "$MYSQL_ENDPOINT_IP" ]; then
                    echo "MySQL endpoint has no ready addresses"
                    exit 1
                  fi

                  MYSQL_POD=$(kubectl get pods -n ${{ env.NAMESPACE }} -l app=mysql-user-db -o jsonpath='{.items[0].metadata.name}')
                  if [ -z "$MYSQL_POD" ]; then
                    echo "MySQL pod not found"
                    exit 1
                  fi

                  ROOT_PASSWORD_B64=$(kubectl get secret mysql-user-secret -n ${{ env.NAMESPACE }} -o jsonpath='{.data.root-password}')
                  if [ -z "$ROOT_PASSWORD_B64" ]; then
                    echo "MySQL root password key not found in Kubernetes secret mysql-user-secret"
                    exit 1
                  fi

                  MYSQL_PWD=$(printf '%s' "$ROOT_PASSWORD_B64" | base64 --decode)
                  if [ -z "$MYSQL_PWD" ]; then
                    echo "Decoded MySQL root password is empty"
                    exit 1
                  fi

                  echo "Pinging MySQL in pod: $MYSQL_POD"
                  kubectl exec -n ${{ env.NAMESPACE }} "$MYSQL_POD" -- env MYSQL_PWD="$MYSQL_PWD" mysqladmin ping -u root --silent

                  echo "Running MySQL SELECT 1"
                  DB_RESULT=$(kubectl exec -n ${{ env.NAMESPACE }} "$MYSQL_POD" -- env MYSQL_PWD="$MYSQL_PWD" mysql -u root -Nse 'SELECT 1')
                  if [ "$DB_RESULT" != "1" ]; then
                    echo "MySQL query check failed. Result: $DB_RESULT"
                    exit 1
                  fi

                  echo "MySQL readiness and ping checks passed"

            - name: Post integration summary
              if: always()
              env:
                  BASE_URL: ${{ secrets.UAT_API_ENDPOINT }}
              run: |
                  echo "## 🧪 Integration Test Summary" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
                  echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
                  echo "| **Service** | User Store Service |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Environment** | \`${{ github.event.inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Namespace** | \`${{ env.NAMESPACE }}\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Endpoint** | \`"${BASE_URL%/}"\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Checks** | API health + MySQL readiness + MySQL ping/query |" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY

                  if [ "${{ job.status }}" == "success" ]; then
                    echo "### ✅ Status: Integration Tests Passed" >> $GITHUB_STEP_SUMMARY
                  else
                    echo "### ❌ Status: Integration Tests Failed" >> $GITHUB_STEP_SUMMARY
                  fi
