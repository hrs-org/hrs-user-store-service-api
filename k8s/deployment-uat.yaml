apiVersion: v1
kind: ServiceAccount
metadata:
    name: hrs-user-service-sa
    namespace: __NAMESPACE__
    labels:
        app: hrs-user-service
        environment: uat

automountServiceAccountToken: false
---
# HRS User Store Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
    name: hrs-user-service
    namespace: uat
    labels:
        app: hrs-user-service
spec:
    replicas: 1
    selector:
        matchLabels:
            app: hrs-user-service
    template:
        metadata:
            labels:
                app: hrs-user-service
        spec:
            serviceAccountName: hrs-user-service-sa
            automountServiceAccountToken: false
            # SNYK-CC-K8S-6: Add security context at pod level
            securityContext:
                runAsNonRoot: true
                runAsUser: 10007 # High UID to avoid host conflicts
                fsGroup: 10007
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: hrs-user-service
                  image: __ACR_NAME__.azurecr.io/hrs-user-service:__IMAGE_TAG__
                  imagePullPolicy: Always
                  ports:
                      - containerPort: 8080
                        name: http
                  env:
                      - name: ASPNETCORE_ENVIRONMENT
                        value: "Production"
                      # Database Connection
                      - name: ConnectionStrings__DefaultConnection
                        value: "__DB_CONNECTION_STRING__"
                      # Auth0 Configuration
                      - name: Auth0__Domain
                        value: "__AUTH0_DOMAIN__"
                      - name: Auth0__Audience
                        value: "__AUTH0_AUDIENCE__"
                      # Auth0 Management API (for server-to-server)
                      - name: Auth0Management__Domain
                        value: "__AUTH0_MANAGEMENT_DOMAIN__"
                      - name: Auth0Management__ClientId
                        value: "__AUTH0_MANAGEMENT_CLIENT_ID__"
                      - name: Auth0Management__ClientSecret
                        value: "__AUTH0_MANAGEMENT_CLIENT_SECRET__"
                      - name: Auth0Management__CustomerRoleId
                        value: "__AUTH0_MANAGEMENT_CUSTOMER_ROLE_ID__"
                      - name: Auth0Management__OwnerRoleId
                        value: "__AUTH0_MANAGEMENT_OWNER_ROLE_ID__"
                      - name: Auth0Management__EmployeeRoleId
                        value: "__AUTH0_MANAGEMENT_EMPLOYEE_ROLE_ID__"
                      - name: Auth0Management__ManagerRoleId
                        value: "__AUTH0_MANAGEMENT_MANAGER_ROLE_ID__"
                      - name: Auth0Management__AdminRoleId
                        value: "__AUTH0_MANAGEMENT_ADMIN_ROLE_ID__"
                      # CORS Configuration
                      - name: AllowedOrigins
                        value: "__ALLOWED_ORIGINS__"
                      # Service Discovery - Email Service
                      - name: EmailEndpoint
                        value: "__EMAIL_SERVICE_ENDPOINT__"
                  # SNYK-CC-K8S-9, 10, 11, 8, 42: Add container security context
                  securityContext:
                      allowPrivilegeEscalation: false # SNYK-CC-K8S-8
                      privileged: false # SNYK-CC-K8S-9
                      runAsNonRoot: true # SNYK-CC-K8S-10
                      runAsUser: 10007 # SNYK-CC-K8S-10 (high UID)
                      readOnlyRootFilesystem: true # SNYK-CC-K8S-6
                      capabilities:
                          drop:
                              - ALL # SNYK-CC-K8S-11, 42
                  # Add volume for writable directories (needed with readOnlyRootFilesystem)
                  volumeMounts:
                      - name: tmp
                        mountPath: /tmp
                      - name: aspnet-tmp
                        mountPath: /app/.aspnet
                  livenessProbe:
                      httpGet:
                          path: /health/live
                          port: 8080
                      initialDelaySeconds: 30
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3
                  readinessProbe:
                      httpGet:
                          path: /health/ready
                          port: 8080
                      initialDelaySeconds: 10
                      periodSeconds: 5
                      timeoutSeconds: 3
                      failureThreshold: 3
                  resources:
                      requests:
                          memory: "128Mi"
                          cpu: "100m"
                          ephemeral-storage: "512Mi"
                      limits:
                          memory: "256Mi"
                          cpu: "250m"
                          ephemeral-storage: "1Gi"
            # Define temporary volumes for read-only filesystem
            volumes:
                - name: tmp
                  emptyDir:
                      sizeLimit: "256Mi"
                - name: aspnet-tmp
                  emptyDir:
                      sizeLimit: "256Mi"
            imagePullSecrets:
                - name: acr-secret

---
# HRS User Store Service
apiVersion: v1
kind: Service
metadata:
    name: hrs-user-service
    namespace: uat
    labels:
        app: hrs-user-service
spec:
    type: ClusterIP
    ports:
        - port: 80
          targetPort: 8080
          protocol: TCP
          name: http
    selector:
        app: hrs-user-service
