name: HRS User Store Service CI/CD

on:
    pull_request:
        branches: [develop]
    push:
        tags:
            - "v*.*.*"

env:
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
    DOTNET_NOLOGO: true

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 8.0.x

            - name: Authenticate with GitHub Packages
              run: |
                  # Remove existing source if present, then add it
                  dotnet nuget remove source github 2>/dev/null || true
                  dotnet nuget add source --username ${{ github.actor }} \
                    --password ${{ secrets.PACKAGES_READ_TOKEN }} \
                    --store-password-in-clear-text \
                    --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

            - name: Restore dependencies
              run: dotnet restore HikingRentalStore.sln

            - name: Build project
              run: dotnet build HikingRentalStore.sln --configuration Release --no-restore

            - name: Create coverage directory
              run: mkdir -p ./coverage

            - name: Install dotnet-coverage tool
              run: dotnet tool install --global dotnet-coverage

            - name: Run tests with coverage
              run: |
                  dotnet-coverage collect "dotnet test HRS.Test/HRS.Test.csproj --configuration Release --no-build --verbosity normal" \
                    -f xml -o "./coverage/coverage.xml"

                  dotnet test HRS.Test/HRS.Test.csproj --configuration Release --no-build \
                    --logger "trx;LogFileName=TestResults.trx" \
                    --results-directory ./coverage

                  ls -la ./coverage/

            - name: Upload test results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: test-results
                  path: ./coverage/
                  retention-days: 7

    code-quality:
        name: Code Quality Analysis (SAST)
        runs-on: ubuntu-latest
        needs: build
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 8.0.x

            - name: Install SonarCloud scanner
              run: dotnet tool install --global dotnet-sonarscanner

            - name: Authenticate with GitHub Packages
              run: |
                  dotnet nuget remove source github 2>/dev/null || true
                  dotnet nuget add source --username ${{ github.actor }} \
                    --password ${{ secrets.PACKAGES_READ_TOKEN }} \
                    --store-password-in-clear-text \
                    --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

            - name: Download test results
              uses: actions/download-artifact@v4
              with:
                  name: test-results
                  path: ./coverage

            - name: Begin SonarCloud analysis
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              run: |
                  COVERAGE_PATH=$(readlink -f ./coverage/coverage.xml)
                  echo "Using coverage file: $COVERAGE_PATH"

                  SONAR_PARAMS=""
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                    SONAR_PARAMS="/d:sonar.pullrequest.key=${{ github.event.number }} /d:sonar.pullrequest.branch=${{ github.head_ref }} /d:sonar.pullrequest.base=${{ github.base_ref }}"
                  else
                    SONAR_PARAMS="/d:sonar.branch.name=${{ github.ref_name }}"
                  fi

                  dotnet-sonarscanner begin \
                    /k:"hrs-org_hrs-user-store-service-api" \
                    /o:"hrs-org" \
                    /d:sonar.projectBaseDir="$(pwd)" \
                    /d:sonar.token="$SONAR_TOKEN" \
                    /d:sonar.host.url="https://sonarcloud.io" \
                    /d:sonar.cs.vstest.reportsPaths="./coverage/TestResults.trx" \
                    /d:sonar.cs.vscoveragexml.reportsPaths="$COVERAGE_PATH" \
                    /d:sonar.coverage.exclusions="**/HRS.Test/**,**/*Test*.cs,**/Migrations/**,**/Program.cs" \
                    /d:sonar.exclusions="**/Migrations/**" \
                    /d:sonar.scm.disabled=true \
                    /d:sonar.qualitygate.wait=false \
                    $SONAR_PARAMS

            - name: Restore dependencies
              run: dotnet restore HikingRentalStore.sln

            - name: Build for SonarCloud analysis
              run: dotnet build HikingRentalStore.sln --configuration Release --no-restore

            - name: End SonarCloud analysis
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              run: dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

    lint:
        name: Lint
        runs-on: ubuntu-latest
        needs: build
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 8.0.x

            - name: Authenticate with GitHub Packages
              run: |
                  # Remove existing source if present, then add it
                  dotnet nuget remove source github 2>/dev/null || true
                  dotnet nuget add source --username ${{ github.actor }} \
                    --password ${{ secrets.PACKAGES_READ_TOKEN }} \
                    --store-password-in-clear-text \
                    --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

            - name: Restore dependencies
              run: dotnet restore HikingRentalStore.sln

            - name: Check code formatting
              run: dotnet format HikingRentalStore.sln --verify-no-changes --verbosity diagnostic

    security-scan:
        name: Security Scan - Software Composition Analysis (SCA)
        runs-on: ubuntu-latest
        needs: build
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 8.0.x

            - name: Authenticate with GitHub Packages
              run: |
                  # Remove existing source if present, then add it
                  dotnet nuget remove source github 2>/dev/null || true
                  dotnet nuget add source --username ${{ github.actor }} \
                    --password ${{ secrets.PACKAGES_READ_TOKEN }} \
                    --store-password-in-clear-text \
                    --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

            - name: Restore dependencies
              run: dotnet restore HikingRentalStore.sln

            - name: Security audit
              run: |
                  dotnet list HRS.Gateway/HRS.Gateway.csproj package --vulnerable --include-transitive | tee security-audit.txt
                  if grep -q "Severity: High" security-audit.txt; then exit 1; fi

            - name: Upload security scan results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: security-scan(SCA)-results
                  path: security-audit.txt
                  retention-days: 7

    secret-scan:
        name: Scan for Secrets
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Gitleaks CLI
              run: |
                  GITLEAKS_VERSION="8.24.2"
                  ASSET_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

                  FINAL_URL=$(curl --silent --show-error --location \
                      --proto '=https' --tlsv1.2 --max-redirs 5 \
                      --output /dev/null --write-out '%{url_effective}' "$ASSET_URL")

                  case "$FINAL_URL" in
                      https://github.com/*|https://objects.githubusercontent.com/*|https://github-releases.githubusercontent.com/*|https://release-assets.githubusercontent.com/*)
                      echo "Resolved download host is trusted: $FINAL_URL"
                      ;;
                      *)
                      echo "Untrusted redirect target: $FINAL_URL"
                      exit 1
                      ;;
                  esac

                  curl --silent --show-error --location \
                      --proto '=https' --tlsv1.2 --max-redirs 5 \
                      --output gitleaks.tar.gz "$ASSET_URL"
                  tar -xzf gitleaks.tar.gz gitleaks
                  sudo mv gitleaks /usr/local/bin/gitleaks
                  gitleaks version

            - name: Run Gitleaks Scan
              run: gitleaks detect --source . --verbose --redact --exit-code 1

    Container-Security-Scan:
        name: Run Trivy Scan- Container Security Scan
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Run Trivy FS Scan
              uses: aquasecurity/trivy-action@b2933f565dbc598b29947660e66259e3c7bc8561
              with:
                  scan-type: "fs"
                  scan-ref: "."
                  format: "table"
                  exit-code: "1" # ❗ fail pipeline if vulnerabilities found
                  severity: "CRITICAL,HIGH"
                  ignore-unfixed: true

            - name: Build Docker Image
              env:
                  DOCKER_BUILDKIT: 1
                  PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
              run: docker build --secret id=github_packages_token,env=PACKAGES_READ_TOKEN -t my-app:latest -f ./Dockerfile .

            - name: Run Trivy Image Scan
              uses: aquasecurity/trivy-action@b2933f565dbc598b29947660e66259e3c7bc8561
              with:
                  image-ref: "my-app:latest"
                  format: "table"
                  exit-code: "1"
                  severity: "CRITICAL,HIGH"
                  ignore-unfixed: true

            - name: Generate SARIF Report
              uses: aquasecurity/trivy-action@b2933f565dbc598b29947660e66259e3c7bc8561
              with:
                  scan-type: "fs"
                  scan-ref: "."
                  format: "sarif"
                  output: "trivy-results.sarif"

            - name: Upload SARIF to GitHub Security
              # Forked PRs do not get a token with security-events write permission.
              if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
              uses: github/codeql-action/upload-sarif@v4
              with:
                  sarif_file: "trivy-results.sarif"

    pre-dast:
        name: Pre-DAST Security Scan
        runs-on: ubuntu-latest
        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_DATABASE: hrsdb_tmp
                    MYSQL_USER: hrs_user_tmp
                    MYSQL_PASSWORD: hrs_pass_tmp_7f2a
                    MYSQL_ROOT_PASSWORD: root_pass_tmp_9c1e
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -p${MYSQL_ROOT_PASSWORD}"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=12
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Wait for MySQL service
              run: |
                  for i in {1..20}; do
                  if mysqladmin ping -h 127.0.0.1 -u root -p"root_pass_tmp_9c1e" --silent; then
                  echo "MySQL is ready"
                  exit 0
                  fi
                  echo "Waiting for MySQL... (${i}/20)"
                  sleep 3
                  done
                  echo "MySQL did not become ready in time"
                  exit 1

            - name: Build Docker image for pre-DAST
              env:
                  DOCKER_BUILDKIT: 1
                  PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
              run: docker build --secret id=github_packages_token,env=PACKAGES_READ_TOKEN -t pre-dast-user-service:latest -f ./Dockerfile .

            - name: Generate temporary JWT key for pre-DAST
              run: |
                  JWT_TMP_KEY=$(openssl rand -base64 48 | tr -d '\n')
                  echo "::add-mask::$JWT_TMP_KEY"
                  echo "JWT_SECRET_KEY=$JWT_TMP_KEY" >> "$GITHUB_ENV"

            - name: Run Docker image locally
              env:
                  DB_CONNECTION_STRING: "Server=host.docker.internal;Port=3306;Database=hrsdb_tmp;User=hrs_user_tmp;Password=hrs_pass_tmp_7f2a;"
                  ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS || 'http://localhost:4200' }}
              run: |
                  echo "Starting container..."
                  docker run -d -p 8080:80 --name pre-dast-user-service \
                    --add-host=host.docker.internal:host-gateway \
                    -e ASPNETCORE_ENVIRONMENT=Production \
                    -e ASPNETCORE_URLS="http://+:80" \
                    -e ConnectionStrings__DefaultConnection="$DB_CONNECTION_STRING" \
                    -e Jwt__Key="$JWT_SECRET_KEY" \
                    -e Jwt__Issuer="HRSApp" \
                    -e Jwt__Audience="HRSUsers" \
                    -e AllowedOrigins="$ALLOWED_ORIGINS" \
                    -e EmailEndpoint="http://localhost:5001" \
                    pre-dast-user-service:latest

                  echo "Waiting for application to start..."
                  sleep 30

                  # Wait for health endpoint with retries (migrations can be slow)
                  health_ok=false
                  for i in {1..20}; do
                    if curl -f http://localhost:8080/health 2>/dev/null; then
                      echo "Health check passed on attempt $i"
                      health_ok=true
                      break
                    fi
                    echo "Health check attempt $i failed, retrying in 5 seconds..."
                    sleep 5
                  done

                  if [ "$health_ok" != "true" ]; then
                    echo "Health endpoint did not become ready in time"
                    docker ps -a
                    docker logs pre-dast-user-service || true
                    exit 1
                  fi

                  echo "Container status:"
                  docker ps -a

                  echo "Container logs:"
                  docker logs pre-dast-user-service

                  echo "Testing health endpoint:"
                  curl -f http://localhost:8080/health || {
                    echo "Health endpoint not available"
                    exit 1
                  }

                  echo "Verifying common probe paths do not return 5xx..."
                  for path in / /favicon.ico /robots.txt /sitemap.xml; do
                    code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080${path}" || true)
                    echo "${path} -> ${code}"
                    if [ -z "$code" ] || [ "$code" = "000" ]; then
                      echo "Endpoint ${path} is unreachable"
                      exit 1
                    fi
                    if [[ "$code" =~ ^5 ]]; then
                      echo "Endpoint ${path} returned ${code}"
                      exit 1
                    fi
                  done

            - name: OWASP ZAP Baseline Scan
              uses: zaproxy/action-baseline@99b9334bed0a0ff8d797764e76c9ecae53168436 # v0.10.0
              with:
                  target: "http://localhost:8080"
                  rules_file_name: ".zap/rules.tsv"
                  cmd_options: "-a -j -l WARN -T 10 -I"

            - name: Upload DAST scan results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: pre-dast-scan-results
                  path: |
                      report_html.html
                      report_json.json
                      report_md.md
                      report_xml.xml
                  retention-days: 7

            - name: Cleanup pre-DAST container
              if: always()
              run: docker rm -f pre-dast-user-service || true

    docker-build:
        name: Build & Push Docker Image to ACR
        runs-on: ubuntu-latest
        needs: [build, code-quality, lint, security-scan, secret-scan, Container-Security-Scan, pre-dast]
        if: github.event_name == 'push'
        environment: uat
        permissions:
            contents: read
        outputs:
            version: ${{ steps.version.outputs.version }}
            image-tag: ${{ steps.version.outputs.image-tag }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install Nerdbank.GitVersioning
              run: dotnet tool install --global nbgv

            - name: Determine version
              id: version
              run: |
                  if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
                    # Tagged release: v1.2.3 → 1.2.3
                    VERSION=${GITHUB_REF#refs/tags/v}
                    IMAGE_TAG="$VERSION"
                    echo "📦 Building RELEASE version: $VERSION"
                  else
                    # Development build: use valid SemVer with prerelease tag
                    SHORT_SHA=$(git rev-parse --short HEAD)
                    # Get version from nbgv, but use valid SemVer format: 1.0.1-dev.abc123
                    BASE_VERSION=$(nbgv get-version -v Version | cut -d'.' -f1-3)
                    VERSION="${BASE_VERSION}-dev.${SHORT_SHA}"
                    IMAGE_TAG="dev-${SHORT_SHA}"
                    echo "📦 Building DEV version: $VERSION (image tag: $IMAGE_TAG)"
                  fi

                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  echo "image-tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Azure
              uses: azure/login@v1
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Log in to Azure Container Registry
              run: |
                  az acr login --name ${{ secrets.ACR_NAME }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  build-args: |
                      VERSION=${{ steps.version.outputs.version }}
                  secrets: |
                      github_packages_token=${{ secrets.PACKAGES_READ_TOKEN }}
                  tags: |
                      ${{ secrets.ACR_NAME }}.azurecr.io/hrs-user-service:${{ steps.version.outputs.image-tag }}
                      ${{ secrets.ACR_NAME }}.azurecr.io/hrs-user-service:latest
                      ${{ secrets.ACR_NAME }}.azurecr.io/hrs-user-service:${{ github.sha }}
                  labels: |
                      org.opencontainers.image.version=${{ steps.version.outputs.version }}
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

            - name: Create deployment info
              run: |
                  mkdir -p artifacts
                  cat > artifacts/deployment-info.txt <<EOF
                  VERSION=${{ steps.version.outputs.version }}
                  IMAGE_TAG=${{ steps.version.outputs.image-tag }}
                  COMMIT_SHA=${{ github.sha }}
                  BRANCH=${{ github.ref_name }}
                  BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
                  TRIGGERED_BY=${{ github.actor }}
                  EOF

                  echo "📄 Deployment Info:"
                  cat artifacts/deployment-info.txt

            - name: Upload deployment info
              uses: actions/upload-artifact@v4
              with:
                  name: deployment-info
                  path: artifacts/deployment-info.txt
                  retention-days: 30

    dast:
        name: DAST Security Scan
        runs-on: ubuntu-latest
        needs: [pre-dast, docker-build]
        if: github.event_name == 'push'
        environment: uat
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Log in to Azure
              uses: azure/login@v1
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Pull and run Docker image
              env:
                  IMAGE_TAG: ${{ needs.docker-build.outputs.image-tag }}
              run: |
                  az acr login --name ${{ secrets.ACR_NAME }}

                  # Read image tag produced by docker-build job
                  IMAGE_TAG="${{ needs.docker-build.outputs.image-tag }}"

                  echo "Image tag from docker-build: ${IMAGE_TAG}"

                  if [ -z "$IMAGE_TAG" ]; then
                    echo "ERROR: IMAGE_TAG is empty!"
                    echo "Using 'latest' as fallback"
                    IMAGE_TAG="latest"
                  fi

                  IMAGE_REPO="${{ secrets.ACR_NAME }}.azurecr.io/hrs-user-service:${IMAGE_TAG}"

                  echo "Pulling image: $IMAGE_REPO"
                  docker pull "$IMAGE_REPO"

                  echo "Starting container..."
                  docker run -d -p 5000:80 --name hrs-user-service \
                    -e ASPNETCORE_ENVIRONMENT=Production \
                    -e ASPNETCORE_URLS="http://+:80" \
                    -e ConnectionStrings__DefaultConnection="${{ secrets.DB_CONNECTION_STRING || 'Server=localhost;Database=hrsdb;' }}" \
                    -e Jwt__Key="${{ secrets.JWT_SECRET_KEY }}" \
                    -e Jwt__Issuer="HRSApp" \
                    -e Jwt__Audience="HRSUsers" \
                    -e AllowedOrigins="${{ secrets.ALLOWED_ORIGINS || 'http://localhost:4200' }}" \
                    -e EmailEndpoint="http://localhost:5001" \
                    ${{ secrets.ACR_NAME }}.azurecr.io/hrs-user-service:${IMAGE_TAG}

                  echo "Waiting for application to start..."
                  sleep 20

                  echo "Container status:"
                  docker ps -a

                  echo "Container logs:"
                  docker logs hrs-user-service || true

                  echo "Testing health endpoint:"
                  curl -f http://localhost:5000/health || echo "Health endpoint not available"

                  echo "Verifying common probe paths do not return 5xx..."
                  for path in / /favicon.ico /robots.txt /sitemap.xml; do
                    code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:5000${path}")
                    echo "${path} -> ${code}"
                    if [[ "$code" =~ ^5 ]]; then
                      echo "Endpoint ${path} returned ${code}"
                      exit 1
                    fi
                  done

            - name: OWASP ZAP Baseline Scan
              uses: zaproxy/action-baseline@99b9334bed0a0ff8d797764e76c9ecae53168436 # v0.10.0
              with:
                  target: "http://localhost:5000"
                  rules_file_name: ".zap/rules.tsv"
                  cmd_options: "-a -j -l WARN -T 10 -I"

            - name: Upload DAST scan results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: dast-scan-results
                  path: |
                      report_html.html
                      report_json.json
                      report_md.md
                      report_xml.xml
                  retention-days: 7

            - name: Stop application
              if: always()
              run: |
                  docker stop hrs-user-service || true
                  docker rm hrs-user-service || true
